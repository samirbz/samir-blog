<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Margin Notes — a reading blog</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap">
    <style>
        :root {
            --bg: #eef1f4;
            --surface: #ffffff;
            --ink: #1b2430;
            --muted: #5b6675;
            --line: #d3dae2;
            --accent: #0e6b6b;
            --accent-ink: #ffffff;
            --mark: #f3c94a;
            --head: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
            --body: "Newsreader", Georgia, "Times New Roman", serif;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #10161d;
                --surface: #18212b;
                --ink: #e8edf2;
                --muted: #9aa6b4;
                --line: #2a3542;
                --accent: #5fc4c0;
                --accent-ink: #06201f;
                --mark: #8a6d12;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #10161d;
            --surface: #18212b;
            --ink: #e8edf2;
            --muted: #9aa6b4;
            --line: #2a3542;
            --accent: #5fc4c0;
            --accent-ink: #06201f;
            --mark: #8a6d12;
            color-scheme: dark
        }

        html {
            scroll-padding-top: env(safe-area-inset-top, 0px)
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font: 1.125rem/1.65 var(--body)
        }

        a {
            color: inherit
        }

        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 3px;
            border-radius: 4px
        }

        .wrap {
            max-width: 46rem;
            margin: 0 auto;
            padding: 0 1.25rem
        }

        header.site {
            padding: 2.5rem 0 1.5rem;
            border-bottom: 2px solid var(--ink)
        }

        .bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem
        }

        .brand {
            font: 800 clamp(2rem, 7vw, 3.2rem)/1 var(--head);
            letter-spacing: -.03em;
            text-decoration: none
        }

        .tag {
            margin: .6rem 0 0;
            color: var(--muted);
            font-style: italic
        }

        button {
            font: inherit;
            cursor: pointer
        }

        .theme {
            background: none;
            border: 1px solid var(--line);
            color: var(--ink);
            border-radius: 999px;
            padding: .35rem .9rem;
            font: 500 .9rem var(--head)
        }

        .tools {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem;
            align-items: center;
            margin: 1.5rem 0
        }

        .search {
            flex: 1 1 14rem;
            padding: .6rem .9rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            color: var(--ink);
            font: 1rem var(--body)
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: .4rem
        }

        .chip {
            border: 1px solid var(--line);
            background: transparent;
            color: var(--ink);
            border-radius: 999px;
            padding: .3rem .85rem;
            font: 500 .9rem var(--head)
        }

        .chip[aria-pressed="true"] {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--accent-ink)
        }

        .post {
            display: block;
            width: 100%;
            text-align: left;
            background: none;
            border: 0;
            border-top: 1px solid var(--line);
            padding: 1.5rem 0;
            color: inherit
        }

        .post:first-child {
            border-top: 0
        }

        .post h2 {
            margin: 0 0 .35rem;
            font: 700 1.55rem/1.2 var(--head);
            letter-spacing: -.015em
        }

        .post:hover h2 {
            text-decoration: underline;
            text-decoration-color: var(--accent);
            text-underline-offset: 4px
        }

        .meta {
            color: var(--muted);
            font-size: .95rem
        }

        .post p {
            margin: .5rem 0 0
        }

        .featured {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 1.5rem;
            margin-bottom: 1rem
        }

        .featured h2 {
            font-size: 2rem
        }

        mark {
            background: var(--mark);
            color: inherit;
            border-radius: 2px
        }

        .empty {
            padding: 2rem 0;
            color: var(--muted)
        }

        article h1 {
            font: 800 clamp(2rem, 6vw, 2.8rem)/1.1 var(--head);
            letter-spacing: -.025em;
            margin: 1.5rem 0 .5rem
        }

        article p {
            margin: 0 0 1.15rem
        }

        article h3 {
            font: 700 1.3rem var(--head);
            margin: 2rem 0 .5rem
        }

        article blockquote {
            margin: 1.5rem 0;
            padding-left: 1.1rem;
            border-left: 4px solid var(--accent);
            font-style: italic
        }

        .back {
            background: none;
            border: 0;
            color: var(--accent);
            font: 600 1rem var(--head);
            padding: 1.5rem 0 0
        }

        .progress {
            position: fixed;
            left: 0;
            top: 0;
            height: 4px;
            width: 0;
            background: var(--accent);
            z-index: 20
        }

        .sub {
            margin: 3rem 0;
            padding: 1.5rem;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px
        }

        .sub h3 {
            margin: 0 0 .25rem
        }

        .sub form {
            display: flex;
            flex-wrap: wrap;
            gap: .5rem;
            margin-top: .75rem
        }

        .sub input {
            flex: 1 1 14rem;
            padding: .6rem .9rem;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--bg);
            color: var(--ink);
            font: 1rem var(--body)
        }

        .sub button {
            background: var(--accent);
            color: var(--accent-ink);
            border: 0;
            border-radius: 8px;
            padding: .6rem 1.2rem;
            font: 600 1rem var(--head)
        }

        footer {
            border-top: 1px solid var(--line);
            margin-top: 3rem;
            padding: 1.5rem 0 3rem;
            color: var(--muted);
            font-size: .95rem
        }

        [hidden] {
            display: none !important
        }

        @media (prefers-reduced-motion:no-preference) {
            .progress {
                transition: width .1s linear
            }
        }
    </style>
</head>

<body>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="wrap">
        <header class="site">
            <div class="bar">
                <a class="brand" href="#home" id="brand">Margin Notes</a>
                <button class="theme" id="theme" type="button" aria-label="Toggle dark mode">Dark mode</button>
            </div>
            <p class="tag">Short essays on books, reading habits, and the things we scribble beside the text.</p>
        </header>

        <main>
            <section id="list">
                <div class="tools">
                    <input class="search" id="search" type="search" placeholder="Search posts"
                        aria-label="Search posts">
                    <div class="chips" id="chips" role="group" aria-label="Filter by topic"></div>
                </div>
                <div id="posts"></div>
            </section>

            <section id="reader" hidden>
                <button class="back" id="back" type="button">Back to all posts</button>
                <article id="article"></article>
                <div class="sub">
                    <h3>Get new posts by email</h3>
                    <div class="meta">One email when a new essay is published.</div>
                    <form id="subform">
                        <input type="email" id="email" placeholder="you@example.com" aria-label="Email address"
                            required>
                        <button type="submit">Subscribe</button>
                    </form>
                    <p class="meta" id="subMsg" role="status"></p>
                </div>
            </section>
        </main>

        <footer>© 2026 Margin Notes. Written slowly.</footer>
    </div>

    <script>
        const POSTS = [
            {
                id: "read-slower", title: "Why I started reading slower", topic: "Habits", date: "2026-11-02",
                excerpt: "Finishing fewer books turned out to be the best change I made this year.",
                body: ["For years I measured my reading by the count. Fifty books a year felt like proof that I was serious. Then I noticed I couldn’t say what half of them were about.", "<h3>What changed</h3>", "I set a rule: no new book until I’ve written three sentences about the last one. Some weeks that meant nothing got finished. But the books I did finish stayed with me.", "<blockquote>A book you can’t describe is a book you haven’t finished, whatever the last page says.</blockquote>", "Now I read about twenty books a year, and I can tell you something specific about each of them. That feels like a better deal."]
            },
            {
                id: "pencil-vs-highlighter", title: "Pencil beats highlighter", topic: "Tools", date: "2026-10-21",
                excerpt: "A highlighter says ‘this matters.’ A pencil says why.",
                body: ["Highlighters are fast, and that is the problem. Yellow lines pile up and soon the whole page is ‘important.’", "<h3>Three marks I use instead</h3>", "A vertical line for a passage worth rereading. A question mark when I disagree. A short word in the margin, like ‘source?’ or ‘same as ch. 2,’ when I want to connect ideas.", "Those marks are cheap, and months later they tell me what I was thinking at the time, which a yellow stripe never does."]
            },
            {
                id: "library-sundays", title: "Library Sundays", topic: "Places", date: "2026-10-09",
                excerpt: "Two hours, one table, no phone. A small ritual that stuck.",
                body: ["Every Sunday morning I go to the same table by the window. I bring one book and one notebook, and nothing with a screen.", "<h3>Why it works</h3>", "The rules are so small that I can’t argue myself out of them. It’s only two hours. The table is always there. And the quiet does half the work for me.", "Some weeks I read forty pages. Some weeks I just stare out the window. Both count."]
            },
            {
                id: "rereading", title: "In defense of rereading", topic: "Habits", date: "2026-09-27",
                excerpt: "The second time through, you’re reading a different book.",
                body: ["We treat rereading as a luxury for people with time. I think it’s the opposite: it’s the most efficient way to get more from something you already trust.", "<h3>What you notice</h3>", "The first read is about plot. The second is about structure: why the author put that scene there, what a throwaway line was setting up.", "<blockquote>You can’t step in the same book twice, because you’re not the same reader.</blockquote>", "Pick one book a year that you loved and read it again. Keep your old notes next to the new ones."]
            },
            {
                id: "notebook-system", title: "A notebook system with three rules", topic: "Tools", date: "2026-09-12",
                excerpt: "No tags, no apps, no index. Just a date and a title on every page.",
                body: ["I’ve tried every note-taking system. The ones that failed all asked me to do extra work at the moment I least wanted to.", "<h3>The rules</h3>", "Write the date. Write a title. Never skip a page. That’s all of it.", "Finding things is slower than with software, but I find myself browsing, and browsing is where I rediscover my own best ideas."]
            }
        ];

        const $ = s => document.querySelector(s);
        const state = { topic: "All", q: "" };
        const topics = ["All", ...new Set(POSTS.map(p => p.topic))];
        const fmt = d => new Date(d + "T00:00:00").toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" });
        const words = p => p.body.join(" ").replace(/<[^>]+>/g, "").split(/\s+/).length;
        const mins = p => Math.max(1, Math.round(words(p) / 220));
        const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

        function hi(text) {
            const t = esc(text);
            if (!state.q) return t;
            const re = new RegExp("(" + state.q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
            return t.replace(re, "<mark>$1</mark>");
        }

        function renderChips() {
            $("#chips").innerHTML = topics.map(t =>
                `<button type="button" class="chip" data-t="${t}" aria-pressed="${t === state.topic}">${t}</button>`).join("");
        }

        function renderList() {
            const q = state.q.toLowerCase();
            const items = POSTS.filter(p =>
                (state.topic === "All" || p.topic === state.topic) &&
                (!q || (p.title + " " + p.excerpt + " " + p.body.join(" ")).toLowerCase().includes(q)))
                .sort((a, b) => b.date.localeCompare(a.date));
            $("#posts").innerHTML = items.length ? items.map((p, i) => `
    <button type="button" class="post ${i === 0 && !q && state.topic === "All" ? "featured" : ""}" data-id="${p.id}">
      <div class="meta">${fmt(p.date)} · ${p.topic} · ${mins(p)} min read</div>
      <h2>${hi(p.title)}</h2>
      <p>${hi(p.excerpt)}</p>
    </button>`).join("")
                : `<div class="empty">No posts match that search. Try a different word or choose All.</div>`;
        }

        function openPost(id) {
            const p = POSTS.find(x => x.id === id);
            if (!p) { showList(); return; }
            $("#article").innerHTML = `<div class="meta">${fmt(p.date)} · ${p.topic} · ${mins(p)} min read</div>
    <h1>${esc(p.title)}</h1>` + p.body.map(b => b.startsWith("<") ? b : `<p>${b}</p>`).join("");
            $("#list").hidden = true; $("#reader").hidden = false;
            document.title = p.title + " — Margin Notes";
            window.scrollTo(0, 0); updateProgress();
        }

        function showList() {
            $("#reader").hidden = true; $("#list").hidden = false;
            document.title = "Margin Notes — a reading blog";
            $("#progress").style.width = "0";
        }

        function route() {
            const h = location.hash.slice(1);
            h.startsWith("read-") || POSTS.some(p => p.id === h) ? openPost(h) : showList();
        }

        function updateProgress() {
            if ($("#reader").hidden) return;
            const max = document.documentElement.scrollHeight - innerHeight;
            $("#progress").style.width = (max > 0 ? scrollY / max * 100 : 0) + "%";
        }

        $("#posts").addEventListener("click", e => {
            const b = e.target.closest(".post"); if (b) location.hash = b.dataset.id;
        });
        $("#chips").addEventListener("click", e => {
            const b = e.target.closest(".chip"); if (!b) return;
            state.topic = b.dataset.t; renderChips(); renderList();
        });
        $("#search").addEventListener("input", e => { state.q = e.target.value.trim(); renderList(); });
        $("#back").addEventListener("click", () => { location.hash = "home"; });
        $("#brand").addEventListener("click", () => { setTimeout(route); });
        $("#subform").addEventListener("submit", e => {
            e.preventDefault();
            $("#subMsg").textContent = "Thanks. This demo form doesn’t send email yet, but your address looks valid.";
            e.target.reset();
        });
        addEventListener("hashchange", route);
        addEventListener("scroll", updateProgress, { passive: true });

        // Theme toggle (remembered per viewer when storage is available)
        function applyTheme(t) {
            document.documentElement.setAttribute("data-theme", t);
            $("#theme").textContent = t === "dark" ? "Light mode" : "Dark mode";
        }
        (function initTheme() {
            let t = null;
            try { t = localStorage.getItem("mn-theme"); } catch (e) { }
            if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
            applyTheme(t);
        })();
        $("#theme").addEventListener("click", () => {
            const t = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
            applyTheme(t);
            try { localStorage.setItem("mn-theme", t); } catch (e) { }
        });

        renderChips(); renderList(); route();
    </script>
</body>

</html>
